<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- doGet 也會用 addMetaTag 注入 viewport；這裡再寫一次，
       少了它手機會用桌機寬度縮放，RWD 斷點就不會觸發 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* 紅漲綠跌：台股慣例，與多數西方 dashboard 相反 */
    :root {
      --bg:        #f5f6f8;
      --surface:   #ffffff;
      --border:    #e3e6ea;
      --text:      #1a1d21;
      --text-dim:  #6b7280;
      --up:        #d92b2b;
      --down:      #17914d;
      --accent:    #3b6ef0;
      --grid:      rgba(0,0,0,.07);
      --shadow:    0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
      /* 偏離用的中性色。刻意不共用 --up / --down：紅漲綠跌是「賺賠」的語意，
         超配一檔好標的並不是賠錢，借去表示配置會把兩件事讀成同一件。 */
      --over:      #e8843c;
      --under:     #3b6ef0;
      --alert-bg:  #fff4e5;
      --alert-bd:  #f0c48a;
      --alert-fg:  #8a4b00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #0f1216;
        --surface:  #171b21;
        --border:   #262c34;
        --text:     #e8eaed;
        --text-dim: #8b95a3;
        --up:       #ff5c5c;
        --down:     #35c47a;
        --accent:   #6d92ff;
        --grid:     rgba(255,255,255,.07);
        --shadow:   none;
        --over:     #f0a05a;
        --under:    #6d92ff;
        --alert-bg: #2a2114;
        --alert-bd: #5c4423;
        --alert-fg: #f0c48a;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                   "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 1180px; margin: 0 auto; }

    /* ── Header ─────────────────────────────────────── */
    header { display: flex; align-items: baseline; justify-content: space-between;
             flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .02em; }
    .stamp { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .stamp button {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font: inherit; padding: 0 0 0 8px; text-decoration: underline;
    }

    /* ── Cards ──────────────────────────────────────── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 12px; font-weight: 600; color: var(--text-dim);
      letter-spacing: .08em; text-transform: uppercase;
      margin: 0 0 14px;
    }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .grid2 > .card { margin-bottom: 0; }

    /* ── Hero ───────────────────────────────────────── */
    .hero-value {
      font-size: clamp(32px, 9vw, 46px); font-weight: 650;
      letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1;
    }
    .hero-date { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .chip {
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
      padding: 8px 12px; min-width: 96px;
    }
    .chip .k { font-size: 11px; color: var(--text-dim); }
    .chip .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .up   { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--text-dim); }

    /* ── Range toggle ───────────────────────────────── */
    .ranges { display: flex; gap: 6px; }
    .ranges button {
      background: var(--bg); border: 1px solid var(--border); color: var(--text-dim);
      border-radius: 8px; padding: 5px 12px; font: inherit; font-size: 13px;
      cursor: pointer;
    }
    .ranges button[aria-pressed="true"] {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    }
    .card-head { display: flex; align-items: center; justify-content: space-between;
                 gap: 10px; margin-bottom: 14px; }
    .card-head h2 { margin: 0; }

    .chart-box { position: relative; height: 260px; }
    .chart-box.short { height: 220px; }
    /* 橫條圖的高度隨列數而定，由 JS 寫 inline style */
    .chart-box.auto { height: auto; }

    /* ── 警示條 ─────────────────────────────────────── */
    .alert {
      background: var(--alert-bg); border: 1px solid var(--alert-bd);
      color: var(--alert-fg); border-radius: 12px;
      padding: 12px 16px; margin-bottom: 16px; font-size: 14px;
    }
    .alert b { display: block; margin-bottom: 4px; font-size: 13px; letter-spacing: .04em; }
    .alert ul { margin: 0; padding-left: 18px; }
    .alert li { margin: 2px 0; }

    /* ── 績效 KPI ───────────────────────────────────── */
    /* 欄數寫死成 2 / 3，不用 auto-fit：格線是靠 1px gap 露出容器底色做的，
       最後一列沒填滿時那塊底色會變成一片突兀的空板。2 與 3 都整除 6 格。
       ⚠️ 改 KPI 格數的話這裡要跟著看。 */
    .kpis {
      display: grid; gap: 1px; background: var(--border);
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    @media (min-width: 640px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
    .kpi { background: var(--surface); padding: 12px 14px; }
    .kpi .k { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }
    .kpi .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums;
              letter-spacing: -.01em; line-height: 1.3; }
    .kpi .s { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

    /* ── Cash list ──────────────────────────────────── */
    .rows { display: flex; flex-direction: column; gap: 2px; }
    .row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .row:last-child { border-bottom: none; }
    .row .amt { font-variant-numeric: tabular-nums; font-weight: 500; }
    .row.total { border-top: 1px solid var(--border); margin-top: 4px;
                 padding-top: 10px; font-weight: 650; border-bottom: none; }

    /* ── Holdings table ─────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: right; font-size: 11px; font-weight: 600; color: var(--text-dim);
      letter-spacing: .04em; padding: 0 0 10px; border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; }
    td { text-align: right; padding: 11px 0; border-bottom: 1px solid var(--border);
         font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    .sym { font-weight: 600; }
    .sym small { display: block; font-weight: 400; color: var(--text-dim); font-size: 12px; }
    .warn { color: var(--text-dim); font-size: 11px; }

    /* 手機：表格塌成卡片 */
    @media (max-width: 720px) {
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { padding: 12px 0; border-bottom: 1px solid var(--border); }
      tr:last-child { border-bottom: none; }
      td { border: none; padding: 3px 0; text-align: right;
           display: flex; justify-content: space-between; align-items: baseline; }
      td:first-child { margin-bottom: 6px; }
      td::before {
        content: attr(data-label); font-size: 12px; color: var(--text-dim);
        font-weight: 400; letter-spacing: .02em;
      }
      td:first-child::before { content: none; }
    }

    .state { text-align: center; color: var(--text-dim); padding: 48px 16px; font-size: 14px; }
    .state.err { color: var(--up); }
    .muted { color: var(--text-dim); font-size: 13px; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Iris 資產儀表板</h1>
    <div class="stamp">
      <span id="stamp">載入中…</span>
      <button id="refresh" type="button">重新整理</button>
    </div>
  </header>

  <div id="state" class="state">讀取資料中…</div>
  <div id="content" hidden>

    <div class="alert" id="alerts" hidden></div>

    <div class="card">
      <div class="hero-value" id="netTotal">—</div>
      <div class="hero-date" id="netDate"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="card">
      <h2>投資績效</h2>
      <div class="kpis" id="kpis"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>總資產走勢</h2>
        <div class="ranges" id="ranges">
          <button type="button" data-days="30">30 天</button>
          <button type="button" data-days="90" aria-pressed="true">90 天</button>
          <button type="button" data-days="365">1 年</button>
        </div>
      </div>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="grid2" style="margin-bottom:16px">
      <div class="card">
        <h2>資產配置</h2>
        <div class="chart-box short"><canvas id="allocChart"></canvas></div>
      </div>
      <div class="card">
        <h2>現金與其他部位</h2>
        <div class="rows" id="cashRows"></div>
      </div>
    </div>

    <div class="card" id="devCard">
      <div class="card-head">
        <h2>目標配置偏離</h2>
        <span class="muted" id="devHint"></span>
      </div>
      <div class="chart-box auto"><canvas id="devChart"></canvas></div>
      <div class="muted" id="devEmpty" hidden>
        還沒有任何分組設定目標 —— 目標填在「標的」的 <b>目標配置%</b>，
        填的是 0..1 的比例（12.5% 要寫 0.125）。
      </div>
    </div>

    <div class="card">
      <h2>持倉明細</h2>
      <div id="holdingsBox"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>個股累計貢獻</h2>
        <span class="muted">未實現 + 已實現 + 累計股利</span>
      </div>
      <div class="chart-box auto"><canvas id="contribChart"></canvas></div>
    </div>

  </div>
</div>

<script>
// ── 格式化 ─────────────────────────────────────────────
var fmtMoney = function (n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('zh-TW');
};
var fmtPct = function (p) {
  if (p === null || p === undefined || isNaN(p)) return '—';
  return (p >= 0 ? '+' : '') + (p * 100).toFixed(2) + '%';
};
var fmtSigned = function (n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '−') + Math.abs(Math.round(n)).toLocaleString('zh-TW');
};
// 紅漲綠跌
var dirClass = function (n) {
  if (n === null || n === undefined || isNaN(n) || n === 0) return 'flat';
  return n > 0 ? 'up' : 'down';
};
var cssVar = function (name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
};

var DATA = null;
var charts = {};

// ── 圖表共用設定 ───────────────────────────────────────
var baseOpts = function () {
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { intersect: false, mode: 'index' },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: cssVar('--surface'),
        titleColor: cssVar('--text'),
        bodyColor: cssVar('--text'),
        borderColor: cssVar('--border'),
        borderWidth: 1,
        padding: 10,
        displayColors: false
      }
    },
    scales: {
      x: { grid: { display: false }, ticks: { color: cssVar('--text-dim'), maxRotation: 0, autoSkipPadding: 24 } },
      y: {
        grid: { color: cssVar('--grid'), drawBorder: false },
        ticks: {
          color: cssVar('--text-dim'),
          // 直接 toFixed(0) 會讓 15000 與 20000 都變成「2萬」，
          // 非整數萬時保留一位小數才不會出現重複刻度
          callback: function (v) {
            if (Math.abs(v) < 10000) return v.toLocaleString('zh-TW');
            var w = v / 10000;
            return (Number.isInteger(w) ? w : w.toFixed(1)) + '萬';
          }
        }
      }
    }
  };
};

// ── Hero ───────────────────────────────────────────────
function renderHero(d) {
  var t = d.totals;
  if (!t) {
    document.getElementById('netTotal').textContent = '尚無快照資料';
    return;
  }
  document.getElementById('netTotal').textContent = 'NT$ ' + fmtMoney(t.today);
  document.getElementById('netDate').textContent =
    '快照日期 ' + t.todayDate + '（每日 18:00 更新）';

  var chips = [
    { k: '單日',   v: t.dayChange,      pct: t.dayChangePct },
    { k: '近一週', v: null,             pct: t.weekChangePct },
    { k: '近一月', v: null,             pct: t.monthChangePct }
  ];
  document.getElementById('chips').innerHTML = chips.map(function (c) {
    var cls = dirClass(c.pct);
    var main = (c.v !== null && c.v !== undefined)
      ? fmtSigned(c.v) + '　' + fmtPct(c.pct)
      : fmtPct(c.pct);
    return '<div class="chip"><div class="k">' + c.k + '</div>' +
           '<div class="v ' + cls + '">' + main + '</div></div>';
  }).join('');
}

// ── 走勢圖 ─────────────────────────────────────────────
function renderTrend(days) {
  var series = (DATA.series || []).slice(-days);
  if (charts.trend) charts.trend.destroy();
  if (!series.length) return;

  var first = series[0].total;
  var last  = series[series.length - 1].total;
  var color = last >= first ? cssVar('--up') : cssVar('--down');

  var ctx = document.getElementById('trendChart').getContext('2d');
  var grad = ctx.createLinearGradient(0, 0, 0, 260);
  grad.addColorStop(0, color + '38');
  grad.addColorStop(1, color + '00');

  var opts = baseOpts();
  opts.plugins.tooltip.callbacks = {
    label: function (c) { return 'NT$ ' + fmtMoney(c.parsed.y); }
  };

  charts.trend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: series.map(function (r) { return r.date.slice(5); }),
      datasets: [{
        data: series.map(function (r) { return r.total; }),
        borderColor: color,
        backgroundColor: grad,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: color,
        tension: .25,
        fill: true
      }]
    },
    options: opts
  });
}

// ── 配置圓環：由持倉市值 + 現金總額推導 ──────────────────
// 刻意不讀「配置」sheet——那張表的欄位結構會變，
// 從 holdings/cash 這兩份已結構化的資料算，比較不會壞。
function renderAlloc(d) {
  var palette = ['#3b6ef0', '#e8843c', '#35a97a', '#9b5de5', '#e05c8a',
                 '#3aa8c1', '#c9a227', '#7a8794', '#5f7adb', '#c1663a'];
  var items = (d.holdings || [])
    .filter(function (h) { return h.marketValue > 0; })
    .map(function (h) { return { label: h.code + ' ' + h.name, value: h.marketValue }; })
    .sort(function (a, b) { return b.value - a.value; });

  var cashTotal = d.cash ? d.cash.total : 0;
  if (cashTotal > 0) items.push({ label: '現金與其他', value: cashTotal });

  if (charts.alloc) charts.alloc.destroy();
  if (!items.length) return;

  var sum = items.reduce(function (s, i) { return s + i.value; }, 0);

  charts.alloc = new Chart(document.getElementById('allocChart'), {
    type: 'doughnut',
    data: {
      labels: items.map(function (i) { return i.label; }),
      datasets: [{
        data: items.map(function (i) { return i.value; }),
        backgroundColor: items.map(function (_, i) { return palette[i % palette.length]; }),
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '58%',
      plugins: {
        legend: {
          position: 'right',
          labels: { color: cssVar('--text-dim'), boxWidth: 10, boxHeight: 10,
                    padding: 8, font: { size: 11 } }
        },
        tooltip: {
          backgroundColor: cssVar('--surface'),
          titleColor: cssVar('--text'),
          bodyColor: cssVar('--text'),
          borderColor: cssVar('--border'),
          borderWidth: 1,
          padding: 10,
          displayColors: false,
          callbacks: {
            label: function (c) {
              return 'NT$ ' + fmtMoney(c.parsed) +
                     '（' + (c.parsed / sum * 100).toFixed(1) + '%）';
            }
          }
        }
      }
    }
  });
}

// ── 現金 ───────────────────────────────────────────────
function renderCash(d) {
  var box = document.getElementById('cashRows');
  if (!d.cash || !d.cash.accounts || !d.cash.accounts.length) {
    box.innerHTML = '<div class="muted">尚無現金資料</div>';
    return;
  }
  var html = d.cash.accounts.map(function (a) {
    return '<div class="row"><span>' + a.account + '</span>' +
           '<span class="amt">' + fmtMoney(a.amount) + '</span></div>';
  }).join('');
  html += '<div class="row total"><span>合計</span>' +
          '<span class="amt">' + fmtMoney(d.cash.total) + '</span></div>';
  box.innerHTML = html;
}

// ── 持倉 ───────────────────────────────────────────────
function renderHoldings(d) {
  var box = document.getElementById('holdingsBox');
  var hs = d.holdings || [];
  if (!hs.length) {
    box.innerHTML = '<div class="muted">尚無持倉資料</div>';
    return;
  }
  hs = hs.slice().sort(function (a, b) { return b.marketValue - a.marketValue; });

  var head = '<thead><tr>' +
    '<th>標的</th><th>股數</th><th>市價</th><th>當日</th>' +
    '<th>市值</th><th>損益</th><th>報酬率</th><th>佔比</th>' +
    '</tr></thead>';

  var body = hs.map(function (h) {
    return '<tr>' +
      '<td class="sym">' + h.code + '<small>' + (h.name || '') +
        (h.priceMissing ? ' <span class="warn">（市價回補）</span>' : '') + '</small></td>' +
      '<td data-label="股數">' + fmtMoney(h.shares) + '</td>' +
      '<td data-label="市價">' + (h.price ? h.price.toFixed(2) : '—') + '</td>' +
      '<td data-label="當日" class="' + dirClass(h.dayChangePct) + '">' + fmtPct(h.dayChangePct) + '</td>' +
      '<td data-label="市值">' + fmtMoney(h.marketValue) + '</td>' +
      '<td data-label="損益" class="' + dirClass(h.pnl) + '">' + fmtSigned(h.pnl) + '</td>' +
      '<td data-label="報酬率" class="' + dirClass(h.pnlPct) + '">' + fmtPct(h.pnlPct) + '</td>' +
      '<td data-label="佔比">' + (h.ratioOfPortfolio * 100).toFixed(1) + '%</td>' +
    '</tr>';
  }).join('');

  box.innerHTML = '<table>' + head + '<tbody>' + body + '</tbody></table>';
}

// ── 警示條 ─────────────────────────────────────────────
//
// 三個來源，時間點不同，所以分開講而不是合成一句：
//   1. 指標的「⚠️ 待修正」——  Position.replay 的警告，凍結在上次重算那一刻
//   2. 現在讀到的 priceMissing —— 即時，重算之後才壞掉的會只出現在這裡
//   3. 最新一天快照的狀態 —— 走勢圖那條線為什麼是平的
//
// 沒有這條，畫面會把少算過的數字照樣畫成漂亮的圖，而且一聲不吭。
function renderAlerts(d) {
  var box = document.getElementById('alerts');
  var m = d.metrics;
  var items = [];

  var warns = (m && m.warnings) ? m.warnings : [];
  warns.forEach(function (w) {
    items.push(w + (m.lastRebuild ? '（重算於 ' + m.lastRebuild + '）' : ''));
  });

  // 上面那些警告已經點名的代號就不重複講，只在「重算後才壞掉」時才補一句
  var missing = (d.holdings || []).filter(function (h) { return h.priceMissing; })
                                  .map(function (h) { return h.code; });
  var warnText = warns.join('');
  var unheard = missing.filter(function (c) { return warnText.indexOf(c) < 0; });
  if (unheard.length) {
    items.push('現在讀不到市價：' + unheard.join('、') +
               '　—— 這幾檔的市值以 0 計入，總資產與佔比都偏低');
  }

  var series = d.series || [];
  var last = series.length ? series[series.length - 1] : null;
  if (last && last.status) {
    items.push('最新快照（' + last.date + '）狀態為「' + last.status +
               '」，走勢圖末端持平不一定代表行情沒動');
  }

  if (!items.length) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = '<b>需要注意</b><ul>' +
    items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>';
}

// ── 投資績效 ───────────────────────────────────────────
function renderMetrics(d) {
  var box = document.getElementById('kpis');
  var m = d.metrics;
  if (!m) {
    box.innerHTML = '<div class="kpi"><div class="k">投資績效</div>' +
                    '<div class="s">讀不到「指標」分頁</div></div>';
    return;
  }

  var dv = d.dividends;
  var cells = [
    {
      k: '未實現損益', v: fmtSigned(m.unrealized), cls: dirClass(m.unrealized),
      s: '報酬率 ' + fmtPct(m.unrealizedPct) +
         (m.stockCost ? '　成本 ' + fmtMoney(m.stockCost) : '')
    },
    { k: '已實現損益', v: fmtSigned(m.realized), cls: dirClass(m.realized),
      s: '賣出沖銷後的實際損益' },
    {
      k: '累計股利', v: fmtMoney(m.dividendTotal), cls: '',
      // 股利那兩張圖拿掉之後，年度趨勢就靠這一行的 YoY 撐著
      s: dv ? ('今年 ' + fmtMoney(dv.thisYear.total) +
               (dv.yoyChangePct !== null && dv.yoyChangePct !== undefined
                 ? '　年增 ' + fmtPct(dv.yoyChangePct) : '　（無去年同期）'))
            : ''
    },
    { k: '淨損益', v: fmtSigned(m.netPnl), cls: dirClass(m.netPnl),
      s: '未實現 + 已實現 + 股利' },
    {
      k: 'XIRR（年化）',
      v: m.xirr === null ? '—' : fmtPct(m.xirr),
      cls: dirClass(m.xirr),
      // 這個數字只從遷移日起算，不是真實持有全期 —— 不寫出來會被當成一輩子的績效
      s: m.xirr === null ? '現金流跨度不足' : '自期初建倉日起算'
    },
    {
      k: '部位', v: (m.positionCount === null ? '—' : m.positionCount + ' 檔'), cls: '',
      s: (m.tradeCount === null ? '' : m.tradeCount + ' 筆交易') +
         (m.lastRebuild ? '　重算於 ' + m.lastRebuild.slice(5, 16) : '')
    }
  ];

  box.innerHTML = cells.map(function (c) {
    return '<div class="kpi"><div class="k">' + c.k + '</div>' +
           '<div class="v ' + c.cls + '">' + c.v + '</div>' +
           '<div class="s">' + (c.s || '') + '</div></div>';
  }).join('');
}

// ── 橫條圖共用設定 ─────────────────────────────────────
// baseOpts 把金額格式掛在 y 軸；橫條圖的數值軸是 x，所以另外開一份。
function barhOpts() {
  return {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: cssVar('--surface'),
        titleColor: cssVar('--text'),
        bodyColor: cssVar('--text'),
        borderColor: cssVar('--border'),
        borderWidth: 1,
        padding: 10,
        displayColors: false
      }
    },
    scales: {
      x: { grid: { color: cssVar('--grid'), drawBorder: false },
           ticks: { color: cssVar('--text-dim') } },
      y: { grid: { display: false }, ticks: { color: cssVar('--text-dim') } }
    }
  };
}

/** 橫條圖的高度由列數決定，交給 CSS 會壓成一團 */
function sizeBarh(canvasId, count) {
  var box = document.getElementById(canvasId).parentNode;
  box.style.height = Math.max(120, count * 30 + 44) + 'px';
}

// ── 目標配置偏離 ───────────────────────────────────────
//
// 這裡是全站唯一「看了會去做事」的一塊：偏離金額就是下一筆錢該往哪放。
// 資料讀「配置」sheet（Position.rebuild 算好的），不是從 holdings 現推 ——
// 目標只有那張表知道，甜甜圈那張圖跟目標完全無關。
//
// ⚠️ 沒設目標的分組，配置表寫的是空字串而不是 0（「沒設」與「目標是 0」在
// 畫面上長得一樣是原本就有的坑），所以這裡用「有沒有偏離% 這個 key」來濾。
function renderDeviation(d) {
  var rows = (d.allocation || []).filter(function (a) {
    return (a['維度'] === '區域' || a['維度'] === '類型') &&
           a['偏離%'] !== undefined && a['偏離%'] !== null;
  }).sort(function (a, b) { return b['偏離%'] - a['偏離%']; });

  if (charts.dev) charts.dev.destroy();
  document.getElementById('devEmpty').hidden = rows.length > 0;
  document.getElementById('devHint').textContent =
    rows.length ? '正 = 超配　負 = 低配' : '';
  if (!rows.length) {
    document.getElementById('devChart').parentNode.style.height = '0px';
    return;
  }

  sizeBarh('devChart', rows.length);

  var opts = barhOpts();
  opts.scales.x.ticks.callback = function (v) { return (v * 100).toFixed(0) + '%'; };
  opts.plugins.tooltip.callbacks = {
    label: function (c) {
      var r = rows[c.dataIndex];
      var amt = r['偏離金額'];
      var line = '實際 ' + ((r['實際%'] || 0) * 100).toFixed(1) + '%' +
                 '　目標 ' + ((r['目標%'] || 0) * 100).toFixed(1) + '%';
      if (amt === undefined || amt === null) return line;
      return [line, (amt > 0 ? '超出 ' : '不足 ') + fmtMoney(Math.abs(amt))];
    }
  };

  charts.dev = new Chart(document.getElementById('devChart'), {
    type: 'bar',
    data: {
      labels: rows.map(function (r) { return r['維度'] + '·' + r['分組']; }),
      datasets: [{
        data: rows.map(function (r) { return r['偏離%']; }),
        backgroundColor: rows.map(function (r) {
          return r['偏離%'] >= 0 ? cssVar('--over') : cssVar('--under');
        }),
        borderRadius: 4,
        maxBarThickness: 22
      }]
    },
    options: opts
  });
}

// ── 個股累計貢獻 ───────────────────────────────────────
// 未實現 + 已實現 + 累計股利。持倉明細那張表要一列一列讀才看得出誰在拖。
function renderContribution(d) {
  var rows = (d.holdings || []).map(function (h) {
    var un  = h.pnl || 0;
    var re  = h.realizedPnl || 0;
    var div = h.totalDividendReceived || 0;
    return { code: h.code, name: h.name, un: un, re: re, div: div, total: un + re + div };
  }).filter(function (r) { return r.total !== 0; })
    .sort(function (a, b) { return b.total - a.total; });

  if (charts.contrib) charts.contrib.destroy();
  if (!rows.length) {
    document.getElementById('contribChart').parentNode.style.height = '0px';
    return;
  }

  sizeBarh('contribChart', rows.length);

  var opts = barhOpts();
  opts.scales.x.ticks.callback = function (v) {
    if (Math.abs(v) < 10000) return v.toLocaleString('zh-TW');
    var w = v / 10000;
    return (Number.isInteger(w) ? w : w.toFixed(1)) + '萬';
  };
  opts.plugins.tooltip.callbacks = {
    label: function (c) {
      var r = rows[c.dataIndex];
      return ['合計 ' + fmtSigned(r.total),
              '未實現 ' + fmtSigned(r.un),
              '已實現 ' + fmtSigned(r.re),
              '股利 ' + fmtMoney(r.div)];
    }
  };

  charts.contrib = new Chart(document.getElementById('contribChart'), {
    type: 'bar',
    data: {
      labels: rows.map(function (r) { return r.code + ' ' + (r.name || ''); }),
      datasets: [{
        data: rows.map(function (r) { return r.total; }),
        // 這裡是損益，紅漲綠跌照用
        backgroundColor: rows.map(function (r) {
          return r.total >= 0 ? cssVar('--up') : cssVar('--down');
        }),
        borderRadius: 4,
        maxBarThickness: 22
      }]
    },
    options: opts
  });
}

// ── 載入 ───────────────────────────────────────────────
function render(d) {
  DATA = d;
  document.getElementById('state').hidden = true;
  document.getElementById('content').hidden = false;
  document.getElementById('stamp').textContent =
    d.generatedAt + (d.fromCache ? '（快取）' : '');

  renderAlerts(d);
  renderHero(d);
  renderMetrics(d);
  renderAlloc(d);
  renderCash(d);
  renderDeviation(d);
  renderHoldings(d);
  renderContribution(d);

  var pressed = document.querySelector('#ranges button[aria-pressed="true"]');
  renderTrend(parseInt(pressed.dataset.days, 10));
}

function load(noCache) {
  var state = document.getElementById('state');
  state.hidden = false;
  state.className = 'state';
  state.textContent = noCache ? '重新讀取中…' : '讀取資料中…';
  document.getElementById('content').hidden = true;

  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(function (err) {
      state.className = 'state err';
      state.textContent = '載入失敗：' + (err && err.message ? err.message : err);
    })
    .dashboardData(noCache === true);
}

document.getElementById('ranges').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  this.querySelectorAll('button').forEach(function (b) { b.removeAttribute('aria-pressed'); });
  btn.setAttribute('aria-pressed', 'true');
  renderTrend(parseInt(btn.dataset.days, 10));
});

document.getElementById('refresh').addEventListener('click', function () { load(true); });

load(false);
</script>
</body>
</html>
