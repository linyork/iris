<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* 配色一律走 Telegram 注入的 --tg-theme-*，讓面板跟使用者當前主題一致；
       後面的 fallback 只在非 Telegram 環境（例如直接用瀏覽器開）時生效。
       漲跌色不跟主題走 —— 台股紅漲綠跌是語意，不是裝飾。 */
    :root {
      --bg:      var(--tg-theme-bg-color, #17212b);
      --card:    var(--tg-theme-secondary-bg-color, #232e3c);
      --text:    var(--tg-theme-text-color, #f5f5f5);
      --hint:    var(--tg-theme-hint-color, #7d8b99);
      --accent:  var(--tg-theme-button-color, #5288c1);
      --onAccent:var(--tg-theme-button-text-color, #ffffff);
      --up:      #ff5c5c;
      --down:    #35c47a;
      --line:    rgba(127,127,127,.22);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* ⚠️ 頁面必須固定滿版、自己不長高，捲動交給 #scroll。
       GAS 會把內層 iframe 撐成內容高度，若讓 body 隨內容變高，內層就不再捲動，
       需要捲的變成外層文件 —— 而外層被 Telegram 的面板限制住，
       症狀是「拉得動但一放開就彈回去」，最底下的內容永遠碰不到。 */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                   "PingFang TC", sans-serif;
      font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    #scroll {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 12px 12px 0;
    }

    /* ⚠️ 底部墊片，不是留白美感問題，是必要的。
       Telegram 沒有 expand 時，webview 的高度仍是整個螢幕高，但只有上面一段
       露在面板裡 —— 於是 height:100% 拿到的是「整個 webview」而不是「看得到的區域」，
       最後一段內容落在螢幕外，拉得到卻碰不到。
       正解是讀 viewportStableHeight，但那個值要靠 Telegram 的事件送進來，
       在 GAS 的巢狀 iframe 裡收不到。改用墊片把真正的內容頂上來：
       多捲一段空白沒有代價，內容碰不到才有。 */
    .bottom-spacer { height: 55vh; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    h2 { font-size: 11px; font-weight: 600; color: var(--hint);
         letter-spacing: .08em; text-transform: uppercase; margin: 0 0 12px; }

    .total { font-size: 34px; font-weight: 650; letter-spacing: -.02em;
             font-variant-numeric: tabular-nums; line-height: 1.15; }
    .sub { font-size: 12px; color: var(--hint); margin-top: 4px; }
    .linkbtn {
      background: none; border: 0; padding: 0; margin-left: 8px;
      font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline;
    }
    .linkbtn[disabled] { opacity: .5; cursor: default; text-decoration: none; }
    .deltas { display: flex; gap: 16px; margin-top: 14px; }
    .delta .k { font-size: 11px; color: var(--hint); }
    .delta .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--hint); }

    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .head h2 { margin: 0; }
    .ranges { display: flex; gap: 6px; }
    .ranges button {
      background: transparent; border: 1px solid var(--line); color: var(--hint);
      border-radius: 7px; padding: 4px 10px; font: inherit; font-size: 12px;
    }
    .ranges button[aria-pressed="true"] {
      background: var(--accent); border-color: var(--accent); color: var(--onAccent); font-weight: 600;
    }
    .chart { position: relative; height: 170px; }
    /* 橫條圖高度隨列數而定，由 JS 寫 inline style */
    .chart.auto { height: auto; }

    /* 績效格。欄數寫死 2 不用 auto-fit：格線是 1px gap 露出容器底色做的，
       最後一列沒填滿時那塊底色會變成一片突兀的空板。2 整除 6 格。 */
    .kpis {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden;
    }
    .kpi { background: var(--card); padding: 10px 12px; }
    .kpi .k { font-size: 10px; color: var(--hint); letter-spacing: .04em; }
    .kpi .v { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums;
              line-height: 1.35; }
    .kpi .s { font-size: 10px; color: var(--hint); font-variant-numeric: tabular-nums; }

    /* 持倉整列可點 —— 這是 Mini App 相對於獨立網頁真正多出來的能力 */
    .hold {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line);
      cursor: pointer; transition: opacity .15s;
    }
    .hold:last-child { border-bottom: none; }
    .hold:active { opacity: .5; }
    .hold .id { flex: 1; min-width: 0; }
    .hold .code { font-weight: 600; }
    .hold .name { font-size: 12px; color: var(--hint);
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hold .nums { text-align: right; font-variant-numeric: tabular-nums; }
    .hold .mv { font-weight: 500; }
    .hold .pct { font-size: 12px; }
    .chev { color: var(--hint); font-size: 18px; line-height: 1; }

    .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
    .row .amt { font-variant-numeric: tabular-nums; }
    .row.total-row { border-top: 1px solid var(--line); margin-top: 6px;
                     padding-top: 10px; font-weight: 650; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button {
      background: transparent; border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px;
    }
    .chips button:active { opacity: .5; }

    .state { text-align: center; color: var(--hint); padding: 60px 16px; font-size: 14px; }
    .state.err { color: var(--up); }

    /* 確認條：不依賴 Telegram 的 showConfirm。
       ⚠️ 不能用 position: fixed —— fixed 是相對於**整個 webview**，而 webview 比面板
       看得到的區域高，bottom:0 會定位到螢幕外，症狀是「點了完全沒反應」。
       改成一般流內元素，由 ask() 插到捲動容器最上方再捲到頂，那裡必定可見。 */
    .confirm {
      background: var(--card); border: 1px solid var(--accent);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .confirm .q { font-size: 14px; margin-bottom: 14px; }
    .confirm .q b { display: block; font-size: 11px; color: var(--hint);
                    letter-spacing: .08em; margin-bottom: 6px; font-weight: 600; }
    .confirm .btns { display: flex; gap: 10px; }
    .confirm button {
      flex: 1; border: none; border-radius: 10px; padding: 13px;
      font: inherit; font-size: 15px; font-weight: 600;
    }
    .confirm .no { background: transparent; border: 1px solid var(--line); color: var(--hint); }
    .confirm .ok { background: var(--accent); color: var(--onAccent); }
  </style>
</head>
<body>

<div id="scroll">

<div id="state" class="state">讀取中…</div>

<div id="app" hidden>
  <div class="card">
    <div class="total" id="total">—</div>
    <div class="sub" id="stamp"></div>
    <!-- 資料時間 + 重讀。沒有這兩個，數字看起來不對時無從判斷是「真的變了」
         還是「拿到 15 分鐘前的快取」—— 那正是它感覺不會連動的一半原因。 -->
    <div class="sub"><span id="freshness"></span>
      <button type="button" id="reload" class="linkbtn">重新讀取</button></div>
    <div class="deltas" id="deltas"></div>
  </div>

  <div class="card">
    <h2>投資績效</h2>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="card">
    <div class="head">
      <h2>總資產走勢</h2>
      <div class="ranges" id="ranges">
        <button type="button" data-days="30" aria-pressed="true">30天</button>
        <button type="button" data-days="90">90天</button>
        <button type="button" data-days="365">1年</button>
      </div>
    </div>
    <div class="chart"><canvas id="trend"></canvas></div>
  </div>

  <div class="card">
    <h2>持倉 · 點選可問 Iris</h2>
    <div id="holdings"></div>
  </div>

  <div class="card" id="contribCard">
    <div class="head">
      <h2>累計貢獻</h2>
      <span style="font-size:11px;color:var(--hint)">未實現+已實現+股利</span>
    </div>
    <div class="chart auto"><canvas id="contrib"></canvas></div>
  </div>

  <div class="card">
    <h2>現金與其他</h2>
    <div id="cash"></div>
  </div>

  <div class="card">
    <h2>快速提問</h2>
    <div class="chips" id="chips">
      <button type="button" data-q="幫我看一下目前的資產配置有沒有需要調整的地方">配置檢視</button>
      <button type="button" data-q="我最近的資產變化如何？有什麼值得注意的">近期變化</button>
      <button type="button" data-q="以目前的持倉，接下來有什麼風險需要留意">風險提醒</button>
      <button type="button" data-q="今年的股利收入狀況如何">股利狀況</button>
    </div>
  </div>

  <div class="bottom-spacer"></div>
</div>

</div><!-- /#scroll -->

<div class="confirm" id="confirm" hidden>
  <div class="q"><b>要問 IRIS</b><span id="confirmText"></span></div>
  <div class="btns">
    <button type="button" class="no" id="confirmNo">取消</button>
    <button type="button" class="ok" id="confirmOk">送出</button>
  </div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
var DATA = null;
var chart = null;          // 總資產走勢
var contribChart = null;   // 個股累計貢獻。兩張圖各自持有，重畫時只砍自己那張
var INIT_DATA = '';   // 驗簽用，開機時從父層 hash 取得

// ⚠️ GAS 的 HtmlService 一定會把頁面包進一層 iframe（不同 origin），
// 而 Telegram 是把 initData 放在**最上層網址的 hash**（#tgWebAppData=...）。
// iframe 內的 telegram-web-app.js 因此永遠讀到空字串，跨 origin 也拿不到 parent.location。
// google.script.url.getLocation() 是 GAS 專為這個沙箱提供的出口，能取到父層的 hash。
// ⚠️ 不能用 split('&') 拆這個 hash：tgWebAppData 的值**自己就含有 &**（initData 的欄位分隔），
// 正常情況下被編碼成 %26，但若 GAS 已經先解碼過一次，那些 & 就是真的分隔字元，
// split 會把 initData 從中間切斷、hash 欄位掉到外層 —— 症狀就是伺服器回「缺少 hash」。
// 改成抓 tgWebAppData= 到下一個 &tgWebApp 之間的整段（Telegram 其餘參數都以 tgWebApp 開頭，
// 而 initData 的欄位名絕不會）。
var extractHashParam = function (hash, name) {
  var h = String(hash || '').replace(/^#/, '');
  var key = name + '=';
  var start = h.indexOf(key);
  if (start < 0) return '';
  start += key.length;
  var rest = h.slice(start);
  var end = rest.search(/&tgWebApp/);
  return end < 0 ? rest : rest.slice(0, end);
};

// 已編碼（含 %3D / %26）就解一次；已經是明文就原樣拿。
// 目標是讓每個欄位值最後**剛好被解碼一次**，因為 Telegram 是用解碼後的值算簽章的。
var decodeOnce = function (blob) {
  if (!blob) return '';
  return (blob.indexOf('%3D') >= 0 || blob.indexOf('%26') >= 0)
    ? decodeURIComponent(blob)
    : blob;
};

// 同樣因為 iframe，telegram-web-app.js 也沒能套上主題色，這裡自己套。
// key 形如 bg_color → CSS 變數 --tg-theme-bg-color
// 這串是 JSON，裡面沒有 = 或 &，所以 decodeOnce 的判斷條件對它不適用；
// 直接兩種都試：先當明文解析，失敗再解碼一次。
var applyTheme = function (blob) {
  if (!blob) return;
  var t = null;
  try { t = JSON.parse(blob); }
  catch (e) {
    try { t = JSON.parse(decodeURIComponent(blob)); }
    catch (e2) { return; }  // 主題套不上不影響功能，用 fallback 配色
  }
  var root = document.documentElement;
  Object.keys(t).forEach(function (k) {
    if (typeof t[k] === 'string') {
      root.style.setProperty('--tg-theme-' + k.replace(/_/g, '-'), t[k]);
    }
  });
};

var fmt = function (n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('zh-TW');
};
var pct = function (p) {
  if (p === null || p === undefined || isNaN(p)) return '—';
  return (p >= 0 ? '+' : '') + (p * 100).toFixed(2) + '%';
};
var signed = function (n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '−') + Math.abs(Math.round(n)).toLocaleString('zh-TW');
};
var dir = function (n) {
  if (n === null || n === undefined || isNaN(n) || n === 0) return 'flat';
  return n > 0 ? 'up' : 'down';
};
var cssVar = function (n) {
  return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
};

// ── 送問題給 Iris ────────────────────────────────────────
// 答案會 push 進對話，不在面板裡顯示 —— 面板是入口，對話才是 Iris 的主場。
function ask(question) {
  // 用自製的確認條而不是 tg.showConfirm：後者要靠 postEvent 跟 Telegram 客戶端溝通，
  // 而我們被包在 GAS 的 iframe 裡，那條路不一定通——不通時 callback 永遠不會回來，
  // 使用者會覺得點了沒反應。頁面內自己畫最可靠。
  var box = document.getElementById('confirm');
  var scroller = document.getElementById('scroll');
  document.getElementById('confirmText').textContent = question;

  // 插到捲動容器最上方再捲到頂。面板可見的是 webview 的**上緣**那一段，
  // 所以容器頂端必定看得見 —— 這是唯一能確定落在可見區的位置。
  scroller.insertBefore(box, scroller.firstChild);
  box.hidden = false;
  scroller.scrollTop = 0;

  document.getElementById('confirmOk').onclick = function () {
    box.hidden = true;
    google.script.run
      .withFailureHandler(function (err) {
        var s = document.getElementById('state');
        s.hidden = false; s.className = 'state err';
        s.textContent = '送出失敗：' + (err && err.message ? err.message : err);
      })
      .miniAppAsk(INIT_DATA, question);

    // 不等回呼：ReAct 迴圈要數十秒，讓使用者卡在面板上盯著轉圈沒有意義。
    var s = document.getElementById('state');
    s.hidden = false; s.className = 'state';
    s.innerHTML = '已送出，Iris 正在回覆…<br><br>' +
                  '<span style="font-size:13px">回到對話即可看到答案，可關閉此面板。</span>';
    document.getElementById('app').hidden = true;
    scroller.scrollTop = 0;   // 同理，訊息也必須落在可見區
    // tg.close() 在 iframe 內不一定有效，所以上面那句話一定要先講清楚。
    setTimeout(function () { try { if (tg) tg.close(); } catch (e) {} }, 1500);
  };
  document.getElementById('confirmNo').onclick = function () { box.hidden = true; };
}

// ── 渲染 ────────────────────────────────────────────────
function renderTotals(d) {
  var t = d.totals;
  if (!t) { document.getElementById('total').textContent = '尚無快照'; return; }
  document.getElementById('total').textContent = 'NT$ ' + fmt(t.today);
  document.getElementById('stamp').textContent = t.todayDate + ' 快照';
  document.getElementById('freshness').textContent =
    '資料時間 ' + (d.generatedAt || '—') + (d.fromCache ? '（快取）' : '');
  document.getElementById('deltas').innerHTML = [
    { k: '單日', v: signed(t.dayChange) + ' ' + pct(t.dayChangePct), c: dir(t.dayChangePct) },
    { k: '近一週', v: pct(t.weekChangePct),  c: dir(t.weekChangePct) },
    { k: '近一月', v: pct(t.monthChangePct), c: dir(t.monthChangePct) }
  ].map(function (x) {
    return '<div class="delta"><div class="k">' + x.k + '</div>' +
           '<div class="v ' + x.c + '">' + x.v + '</div></div>';
  }).join('');
}

function renderTrend(days) {
  var s = (DATA.series || []).slice(-days);
  if (chart) chart.destroy();
  if (!s.length) return;
  var color = s[s.length - 1].total >= s[0].total ? cssVar('--up') : cssVar('--down');
  var ctx = document.getElementById('trend').getContext('2d');
  var grad = ctx.createLinearGradient(0, 0, 0, 170);
  grad.addColorStop(0, color + '40');
  grad.addColorStop(1, color + '00');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: s.map(function (r) { return r.date.slice(5); }),
      datasets: [{
        data: s.map(function (r) { return r.total; }),
        borderColor: color, backgroundColor: grad, borderWidth: 2,
        pointRadius: 0, pointHoverRadius: 4, tension: .25, fill: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false, padding: 8,
          callbacks: { label: function (c) { return 'NT$ ' + fmt(c.parsed.y); } }
        }
      },
      scales: {
        x: { grid: { display: false },
             ticks: { color: cssVar('--hint'), maxRotation: 0, autoSkipPadding: 28, font: { size: 10 } } },
        y: { grid: { color: cssVar('--line') },
             ticks: { color: cssVar('--hint'), font: { size: 10 },
               callback: function (v) {
                 if (Math.abs(v) < 10000) return v;
                 var w = v / 10000;
                 return (Number.isInteger(w) ? w : w.toFixed(1)) + '萬';
               } } }
      }
    }
  });
}

function renderHoldings(d) {
  var hs = (d.holdings || []).slice().sort(function (a, b) { return b.marketValue - a.marketValue; });
  var box = document.getElementById('holdings');
  if (!hs.length) { box.innerHTML = '<div class="row">尚無持倉</div>'; return; }

  box.innerHTML = hs.map(function (h, i) {
    return '<div class="hold" data-i="' + i + '">' +
      '<div class="id"><div class="code">' + h.code + '</div>' +
      '<div class="name">' + (h.name || '') + '</div></div>' +
      '<div class="nums"><div class="mv">' + fmt(h.marketValue) + '</div>' +
      '<div class="pct ' + dir(h.pnlPct) + '">' + pct(h.pnlPct) + '</div></div>' +
      '<div class="chev">›</div></div>';
  }).join('');

  box.querySelectorAll('.hold').forEach(function (el) {
    el.addEventListener('click', function () {
      var h = hs[parseInt(el.dataset.i, 10)];
      ask('分析我持有的 ' + h.code + ' ' + (h.name || '') +
          '，目前市值 ' + fmt(h.marketValue) + '、報酬率 ' + pct(h.pnlPct) +
          '，有什麼需要注意的嗎？');
    });
  });
}

// 「指標」那張表算好的績效數字。手機版只放六格：面板一次看得完才有意義，
// 想追問細節本來就有下面的快速提問。
function renderMetrics(d) {
  var box = document.getElementById('kpis');
  var m = d.metrics;
  if (!m) { box.innerHTML = '<div class="kpi"><div class="s">讀不到「指標」分頁</div></div>'; return; }

  var dv = d.dividends;
  var cells = [
    { k: '未實現損益', v: signed(m.unrealized), c: dir(m.unrealized), s: '報酬率 ' + pct(m.unrealizedPct) },
    { k: '已實現損益', v: signed(m.realized),   c: dir(m.realized),   s: '賣出沖銷後' },
    { k: '累計股利',   v: fmt(m.dividendTotal), c: '',
      s: dv ? '今年 ' + fmt(dv.thisYear.total) : '' },
    { k: '淨損益',     v: signed(m.netPnl),     c: dir(m.netPnl),     s: '未實現+已實現+股利' },
    // 說明由 Position 寫進「指標」傳上來，不在前端猜原因（算不出來有三種原因）
    { k: 'XIRR（年化）', v: m.xirr === null ? '—' : pct(m.xirr), c: dir(m.xirr),
      s: m.xirrNote || (m.xirr === null ? '尚無法計算' : '自開帳市值起算') },
    { k: '現值殖利率', v: m.currentYield === null ? '—' : pct(m.currentYield), c: '',
      s: '近12月配息 ÷ 市值' },
    { k: '成本殖利率', v: m.costYield === null ? '—' : pct(m.costYield), c: '',
      s: '近12月配息 ÷ 成本' },
    { k: '部位', v: (m.positionCount === null ? '—' : m.positionCount + ' 檔'), c: '',
      s: m.lastRebuild ? '重算於 ' + m.lastRebuild.slice(5, 16) : '' }
  ];

  box.innerHTML = cells.map(function (x) {
    return '<div class="kpi"><div class="k">' + x.k + '</div>' +
           '<div class="v ' + x.c + '">' + x.v + '</div>' +
           '<div class="s">' + (x.s || '') + '</div></div>';
  }).join('');
}

// 個股累計貢獻。持倉那張清單是「現在值多少」，這張是「這檔到底幫我賺了多少」——
// 賣掉的損益與領過的股利都在裡面，看清單看不出來。
function renderContrib(d) {
  var rows = (d.holdings || []).map(function (h) {
    var un = h.pnl || 0, re = h.realizedPnl || 0, dv = h.totalDividendReceived || 0;
    return { code: h.code, name: h.name, un: un, re: re, dv: dv, total: un + re + dv };
  }).filter(function (r) { return r.total !== 0; })
    .sort(function (a, b) { return b.total - a.total; });

  if (contribChart) contribChart.destroy();
  document.getElementById('contribCard').hidden = !rows.length;
  if (!rows.length) return;

  // 手機寬度有限，軸標只放代號；名稱與拆解留在 tooltip
  var box = document.getElementById('contrib').parentNode;
  box.style.height = Math.max(110, rows.length * 28 + 34) + 'px';

  contribChart = new Chart(document.getElementById('contrib'), {
    type: 'bar',
    data: {
      labels: rows.map(function (r) { return r.code; }),
      datasets: [{
        data: rows.map(function (r) { return r.total; }),
        // 這裡是損益，紅漲綠跌照用
        backgroundColor: rows.map(function (r) {
          return r.total >= 0 ? cssVar('--up') : cssVar('--down');
        }),
        borderRadius: 4, maxBarThickness: 18
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false, padding: 8,
          callbacks: {
            title: function (c) {
              var r = rows[c[0].dataIndex];
              return r.code + ' ' + (r.name || '');
            },
            label: function (c) {
              var r = rows[c.dataIndex];
              return ['合計 ' + signed(r.total), '未實現 ' + signed(r.un),
                      '已實現 ' + signed(r.re), '股利 ' + fmt(r.dv)];
            }
          }
        }
      },
      scales: {
        x: { grid: { color: cssVar('--line') },
             ticks: { color: cssVar('--hint'), font: { size: 10 },
               callback: function (v) {
                 if (Math.abs(v) < 10000) return v;
                 var w = v / 10000;
                 return (Number.isInteger(w) ? w : w.toFixed(1)) + '萬';
               } } },
        y: { grid: { display: false }, ticks: { color: cssVar('--hint'), font: { size: 11 } } }
      }
    }
  });
}

function renderCash(d) {
  var box = document.getElementById('cash');
  if (!d.cash || !d.cash.accounts || !d.cash.accounts.length) {
    box.innerHTML = '<div class="row">尚無資料</div>';
    return;
  }
  box.innerHTML = d.cash.accounts.map(function (a) {
    return '<div class="row"><span>' + a.account + '</span>' +
           '<span class="amt">' + fmt(a.amount) + '</span></div>';
  }).join('') +
  '<div class="row total-row"><span>合計</span><span class="amt">' + fmt(d.cash.total) + '</span></div>';
}

function render(d) {
  DATA = d;
  document.getElementById('state').hidden = true;
  document.getElementById('app').hidden = false;
  renderTotals(d);
  renderMetrics(d);
  renderHoldings(d);
  renderContrib(d);
  renderCash(d);
  renderTrend(30);
}

document.getElementById('ranges').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  this.querySelectorAll('button').forEach(function (x) { x.removeAttribute('aria-pressed'); });
  b.setAttribute('aria-pressed', 'true');
  renderTrend(parseInt(b.dataset.days, 10));
});

document.getElementById('chips').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (b) ask(b.dataset.q);
});

// ── 開機 ────────────────────────────────────────────────
(function boot() {
  var state = document.getElementById('state');

  // 把面板撐到滿版。tg.expand() 是由 telegram-web-app.js 從「它所在的 frame」
  // 往上 postEvent，而我們在 GAS 的巢狀 iframe 裡，那條路不保證通，所以三種傳輸都試。
  // 通不通都不影響功能 —— 版面已經改成不依賴面板被撐開。
  try { if (tg) tg.ready(); } catch (e) {}
  try { if (tg && tg.expand) tg.expand(); } catch (e) {}
  try {
    if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
      window.TelegramWebviewProxy.postEvent('web_app_expand', '{}');
    }
  } catch (e) {}
  try {
    if (window.top && window.top !== window) {
      window.top.postMessage(JSON.stringify({ eventType: 'web_app_expand', eventData: {} }), '*');
    }
  } catch (e) {}

  google.script.url.getLocation(function (loc) {
    var rawHash = (loc && loc.hash) || '';

    applyTheme(extractHashParam(rawHash, 'tgWebAppThemeParams'));

    // 父層 hash 為主，tg.initData 為輔（不同平台行為可能有差異）
    INIT_DATA = decodeOnce(extractHashParam(rawHash, 'tgWebAppData')) ||
                (tg && tg.initData) || '';

    if (!INIT_DATA) {
      state.className = 'state err';
      state.textContent = '請從 Telegram 內開啟此頁面。';
      return;
    }

    var reload = document.getElementById('reload');

    // noCache 只在使用者按下重新讀取時帶 true。平常走快取是刻意的：
    // 每次開面板都重算一遍，開啟速度會從瞬間變成數秒。
    function load(noCache) {
      reload.disabled = true;
      reload.textContent = '讀取中…';
      google.script.run
        .withSuccessHandler(function (d) {
          reload.disabled = false;
          reload.textContent = '重新讀取';
          render(d);
        })
        .withFailureHandler(function (err) {
          reload.disabled = false;
          reload.textContent = '重新讀取';
          state.className = 'state err';
          state.textContent = '載入失敗：' + (err && err.message ? err.message : err);
        })
        .miniAppData(INIT_DATA, !!noCache);
    }

    reload.onclick = function () { load(true); };
    load(false);
  });
})();
</script>
</body>
</html>
